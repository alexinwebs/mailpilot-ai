services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: mailpilot, POSTGRES_PASSWORD: change-me, POSTGRES_DB: mailpilot}
    ports: ['5432:5432']
    volumes: [mailpilot_pg:/var/lib/postgresql/data]
    healthcheck: {test: ['CMD-SHELL','pg_isready -U mailpilot'], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes: [mailpilot_redis:/data]
  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    command: npm run start -w @mailpilot/backend
    ports: ['3000:3000']
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
volumes: {mailpilot_pg: {}, mailpilot_redis: {}}
